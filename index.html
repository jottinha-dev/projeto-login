<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login </title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-querys.css">
</head>
<body>
     <main>
        <section id="Login">
            <div id="imagem">
                
            </div>
            <div id="formulario">
                <h1> Login </h1>
                <p> Seja bem vindo novamente. Faça seu login a baixo</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="login" id="ilogin" placeholder=" digite seu email" autocomplete="email" required maxlength="30">
                        <label for="ilogin"> Login</label>
                    </div>
                    <div class="campo">
                        <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" name="senha" id="isenha" placeholder="digite sua senha" autocomplete="current-password" required minlength="8" maxlength="20">
                        <label for="isenha"> Senha </label>
                    </div>
                    <input type="submit" value="entrar">
                    <a href="esqueci.html" class="botao">
                        esqueci a senha <span class="material-symbols-outlined">mail</span>
                    </a>
                </form>
            </div>
        </section>
     </main>
</body>
</html>
